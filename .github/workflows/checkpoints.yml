name: checkpoints

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Checkpoints pass their tests; starters fail them; the hunt is solvable
        run: python scripts/check_checkpoints.py
