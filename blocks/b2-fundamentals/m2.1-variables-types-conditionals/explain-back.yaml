  - id: m2.1.q9
    type: concept
    competencies: [m2.1.c1, m2.1.c5]
    tracks: all
    prompt: "What's the difference between = and ==? Give an example of each from your remix."
    good_answer_notes: "= assigns a value to a variable; == compares two values and gives True/False."
    scoring:
      "0": "Mixes them up."
      "1": "Correct definitions without examples, or examples without explanation."
      "2": "= stores, == compares (giving a bool), with an example of each."
  - id: m2.1.q10
    type: why
    competencies: [m2.1.c4]
    tracks: all
    prompt: "Your calculation function returns its answer instead of printing it. Why is that better?"
    good_answer_notes: "A returned value can be used by other code: main() prints it, tests check it, the verdict can use it. Printing only shows it on screen."
    scoring:
      "0": "Thinks they're the same."
      "1": "Says return 'gives back' a value but not why that matters."
      "2": "Returned values can be reused and tested; print only displays."
  - id: m2.1.q11
    type: predict
    competencies: [m2.1.c3]
    tracks: all
    prompt: "weeks = 4. What do print(f\"{weeks} weeks to go\") and print(\"{weeks} weeks to go\") show?"
    good_answer_notes: "'4 weeks to go' and '{weeks} weeks to go': the f makes it an f-string that fills in {…}."
    scoring:
      "0": "Thinks both print 4."
      "1": "Right outputs, can't say why."
      "2": "Right outputs; the f prefix is what makes the braces get replaced by the value."
  - id: m2.1.q12
    type: predict
    competencies: [m2.1.c5]
    tracks: all
    prompt: "What do these print? print(3 > 2 and 5 < 1), print(3 > 2 or 5 < 1), print(not 5 < 1)"
    good_answer_notes: "False, True, True. and needs both; or needs one; not flips."
    scoring:
      "0": "Two or more wrong."
      "1": "One wrong, or all right without being able to explain and/or."
      "2": "All three right, with and/or/not explained."
  - id: m2.1.q13
    type: trace
    competencies: [m2.1.c6]
    tracks: all
    prompt: |
      Read this traceback. Which line failed, what kind of error is it, and what does the message mean?

      Traceback (most recent call last):
        File "/workspaces/repo/b2-project/plan.py", line 12, in <module>
          main()
        File "/workspaces/repo/b2-project/plan.py", line 5, in main
          print("Total: " + total)
                ~~~~~~~~~~^~~~~~~
      TypeError: can only concatenate str (not "int") to str
    good_answer_notes: "Line 5 in main (the last frame is where it failed); TypeError: trying to + a str and an int. Fix: str(total) or an f-string."
    scoring:
      "0": "Points to line 12, or can't read it."
      "1": "Finds line 5 or names the error, not both."
      "2": "Line 5, TypeError from adding str and int, and a fix (str() or f-string)."
  - id: m2.1.q14
    type: micro-task
    ai_off: true
    competencies: [m2.1.c2, m2.1.c6]
    tracks: all
    language: python
    code: |
      age = input("Age: ")
      if age >= 13:
          print("Welcome!")
    prompt: "No AI for this one, just you and your editor. Save this as fixit.py, run it, read the error, fix it, and run it again. Paste your fixed code, plus one sentence: what was wrong, and on which line did Python complain?"
    expected_fix: "age = int(input(\"Age: \")): input() returns a str, and comparing a str with an int raises TypeError on line 2."
    good_answer_notes: "Fix converts to int (int(input(...)) or age = int(age)). Names TypeError (str vs int) and line 2."
    scoring:
      "0": "Not fixed."
      "1": "Fixed, but can't name the error or the line."
      "2": "Fixed, names the TypeError (str compared with int) and line 2."
