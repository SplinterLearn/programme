  - id: m2.1.q7
    type: edge
    competencies: [m2.1.c4, m2.1.c5]
    tracks: [finance]
    prompt: "What happens if per_week is 0 and you haven't saved enough yet? What should happen instead?"
    good_answer_notes: "ZeroDivisionError (from // or %). It should not crash: check before dividing (in main or the function) and tell the user they'll never reach it at 0 per week. Bonus: negative per_week."
    scoring:
      "0": "Doesn't know, or thinks it returns 0."
      "1": "Knows it crashes (or names ZeroDivisionError) but no plan."
      "2": "Names the crash and proposes a sensible check and message (or has already handled it)."
