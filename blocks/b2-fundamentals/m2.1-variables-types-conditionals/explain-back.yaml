  - id: m2.1.q5
    type: change
    competencies: [m2.1.c5]
    tracks: [finance]
    prompt: "How would you add a 4th verdict, \"halfway\", for 50% and above? Where does it go, and does the order of your elifs matter?"
    good_answer_notes: "After the 80% check and before else: elif saved >= price * 0.5. Order matters: conditions are checked top to bottom, so if 50% came before 80%, 'almost there' could never be reached."
    scoring:
      "0": "Can't place it."
      "1": "Right place but can't explain why order matters (or vice versa)."
      "2": "Places it after 80% and explains that the first true condition wins, so a lower threshold first would hide the higher one."
