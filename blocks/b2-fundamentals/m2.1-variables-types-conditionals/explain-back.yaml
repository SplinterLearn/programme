scope: m2.1
questions:
  - id: m2.1.q1
    type: predict
    competencies: [m2.1.c2, m2.1.c3]
    tracks: all
    prompt: "x = input(\"Number: \") and the user types 5. What does print(x * 2) show, and why?"
    good_answer_notes: "55. input() always returns a str; * 2 on a string repeats it."
    scoring:
      "0": "Says 10, with no idea about types."
      "1": "Says 55 but can't explain why, or explains str but predicts wrong."
      "2": "55, because input() gives a string and * repeats strings."
  - id: m2.1.q2
    type: why
    competencies: [m2.1.c2, m2.1.c3]
    tracks: all
    prompt: "Why did you use int() (or float()) in your main()? What would break if you removed it?"
    good_answer_notes: "input() returns text; arithmetic and comparisons need numbers. Without it you'd get a TypeError (e.g. str and int in >= or //) or wrong results like string repetition."
    scoring:
      "0": "Doesn't know why it's there."
      "1": "'To make it a number', but can't say what would break."
      "2": "input() gives a str, so maths/comparisons fail (TypeError) or behave wrongly without converting."
  - id: m2.1.q3
    type: trace
    competencies: [m2.1.c1, m2.1.c4]
    tracks: [finance]
    prompt: "Walk me through weeks_to_goal(1000, 0, 300) line by line, using your own code. What's in each variable, and what's returned?"
    good_answer_notes: "Typically remaining = 1000; 1000 // 300 = 3; 1000 % 300 = 100 > 0 so +1; returns 4. Accept any correct trace of their own code."
    scoring:
      "0": "Can't trace it or gets the wrong result."
      "1": "Right result but skips steps or can't say what % gives."
      "2": "Correct values at each step, including the role of // and %, and the return value 4."
